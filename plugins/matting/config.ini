# Matting engine config for SnapCut
# engine: birefnet | sam
engine=birefnet

# --- BiRefNet (default) ---
# fp32 版本（CPU 推荐；fp16 是给 WebGPU 的，CPU 上部分算子不支持）
model=model_fp32.onnx
image_size=1024

# --- Post-processing ---
apply_sigmoid=true
# threshold: alpha S 曲线中心。>0.5 压掉灰边（去毛边），<0.5 保留更多半透明（发丝）
threshold=0.5
contrast_k=6
# erode: >0 边缘收缩 N 像素（去白边），<0 向外扩展，0 关闭
erode=0
feather_radius=2
# 去色溢：去除边缘残留的背景色（白边 / 色边）。decon_strength 0~1
decontaminate=true
decon_strength=0.8
# biref_clean_mask: 只保留最大连通域。一键抠图可能多主体，默认关闭
biref_clean_mask=false

# --- SAM (engine=sam 时生效；sam 目录的 config.ini 单独读取) ---
# enc_model=encoder.onnx
# dec_model=decoder.onnx
